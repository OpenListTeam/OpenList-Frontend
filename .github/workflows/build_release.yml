name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g., 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Build Release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress

      - name: Download i18n.tar.gz from latest release
        run: |
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName | jq -r '.[0].tagName')
          echo "Downloading i18n.tar.gz from release: $LATEST_RELEASE"
          gh release download "$LATEST_RELEASE" --pattern "i18n.tar.gz" --dir dist/ || echo "i18n.tar.gz not found in latest release"
          ls -la dist/i18n.tar.gz 2>/dev/null || echo "No i18n.tar.gz downloaded"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          gh release create \
            --title "Release ${{ github.ref_name }}" \
            ${{ github.ref_name }} \
            dist/openlist-frontend-dist-v*.tar.gz \
            dist/i18n.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
