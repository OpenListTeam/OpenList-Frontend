name: Format

on:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      FORMAT_PR_BRANCH: ${{ vars.FORMAT_PR_BRANCH || 'chore/auto-format' }}
      FORMAT_TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install

      - name: Format
        run: pnpm run format

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "No formatting changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formatting changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        id: import-gpg
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit formatting changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"
          git checkout -B "$FORMAT_PR_BRANCH"
          git add src/
          git commit -S -m "style: format code with prettier"

      - name: Push formatting branch
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: git push --force-with-lease origin "$FORMAT_PR_BRANCH"

      - name: Create or update formatting pull request
        if: steps.verify-changed-files.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          PR_TITLE="style: format code with prettier"
          PR_BODY="This pull request was automatically generated by the format workflow."
          EXISTING_PR=$(gh pr list --head "$FORMAT_PR_BRANCH" --base "$FORMAT_TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --head "$FORMAT_PR_BRANCH" --base "$FORMAT_TARGET_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi
